name: Build & Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: alpine-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker
        run: docker build -t one-piece-app .

      - name: Deploy
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

